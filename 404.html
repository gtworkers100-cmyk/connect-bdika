<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><title>Connect</title>
<script>
// קישור קצר לשותף: /k14 -> /?src=rh-k14 . כל נתיב אחר חוזר לעמוד הראשי
(function(){var p=location.pathname.replace(/^\/+|\/+$/g,'').toLowerCase();
var m=p.match(/^(?:rh-)?([kan]\d{2,3})$/);
location.replace('/'+(m?'?src=rh-'+m[1]:'')+location.hash);})();
</script></head><body></body></html>
